<section class="grid row">
  <div class="text lead" style="grid-column: 6 / 11"><p>这座教学楼由北京大学委托建造，其设计汲取了历史悠久的北京大学红楼的建筑语言——通过抽象化并重新诠释其砖砌立面，以此呼应校园建筑遗产的延续性。该建筑的核心是一个开放的、全天候的学术环境：室内外露台、阅读平台、演讲厅以及非正式聚会空间层层交错，营造出鼓励学生与研究人员之间自发交流的氛围。</p></div>
</section>
