<section class="grid row">
  <div class="text lead" style="grid-column: 6 / 11"><p>这座教学楼由北京大学委托设计，借用了北大红楼的建筑语言：把红楼的砖砌立面抽象、重新诠释，延续校园的建筑传统。建筑的核心是一个开放、全天候的学术环境：室内外露台、阅读平台、报告厅和非正式的交流空间层层叠落，让学生和研究者随时可以碰面、交流。</p></div>
</section>
